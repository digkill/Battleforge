# Апгрейд соединения пробрасывается только когда клиент его запросил: для обычных
# HTTP-запросов Connection должен остаться пустым, иначе апстрим получит мусор.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Игра встраивается в iframe на games.pikabu.ru, поэтому X-Frame-Options здесь
    # не выставляется намеренно — он ломает встраивание. Ограничение задаётся
    # через frame-ancestors, который понимает список доменов.
    add_header Content-Security-Policy "frame-ancestors https://games.pikabu.ru https://*.pikabu.ru" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Бэкенд живёт в той же docker-сети стека. Проксирование через тот же origin
    # снимает CORS и mixed content: игра открыта по https, а браузер внутри iframe
    # заблокировал бы обращения на http-бэкенд другого хоста.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket боя: /api/battle/ws
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Бой пошаговый — игрок может думать над ходом долго, поэтому таймаут
        # чтения заведомо больше дефолтных 60 секунд.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
